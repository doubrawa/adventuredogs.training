<script>
  // Auto-apply filter when arriving via ?cat=... (deep-links from Landing service cards)
  window.addEventListener('DOMContentLoaded', () => {
    const cat = new URLSearchParams(window.location.search).get('cat');
    if (!cat) return;
    const btn = [...document.querySelectorAll('.filter-btn')].find(b =>
      (b.getAttribute('onclick') || '').includes("filterCards('" + cat + "',")
    );
    if (btn) {
      btn.click();
      btn.closest('.filter-section')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });
</script>
